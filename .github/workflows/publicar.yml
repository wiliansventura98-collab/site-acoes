name: Gerar dados e publicar o site

# Roda a cada envio ao ramo main (ou manualmente): verifica privacidade, executa o pipeline em Python,
# gera a versão em espanhol, salva os dados gerados no repositório e publica o site no GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: a data de atualização dos dados vem do último commit da planilha

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Verificar ausência de dados pessoais
        run: python pipeline/verificar_privacidade.py

      - name: Gerar dados (pipeline)
        run: python pipeline/construir_site.py --ano 2024

      - name: Verificar dados gerados
        run: python pipeline/verificar_privacidade.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar a versão em espanhol (es/ e assets/js/app-es/)
        run: |
          npm install --prefix i18n --no-save --no-package-lock typescript@5.6.3
          node i18n/ferramenta.js gerar

      - name: Salvar dados gerados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados es assets/js/app-es i18n/pendentes.json
          if git diff --cached --quiet; then
            echo "Dados já estavam atualizados."
          else
            git commit -m "Atualiza dados e versão em espanhol gerados pelo pipeline [skip ci]"
            git push
          fi

      - name: Preparar arquivos do site
        run: |
          mkdir -p _site
          cp -r index.html base sobre producoes historia es assets dados .nojekyll _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
