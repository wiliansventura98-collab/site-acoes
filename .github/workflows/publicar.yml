name: Gerar dados e publicar o site

# Roda a cada envio ao ramo main (ou manualmente): verifica privacidade, executa o pipeline em Python,
# salva os dados gerados no repositório e publica o site no GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Verificar ausência de dados pessoais
        run: python pipeline/verificar_privacidade.py

      - name: Gerar dados (pipeline)
        run: python pipeline/construir_site.py --ano 2024

      - name: Verificar dados gerados
        run: python pipeline/verificar_privacidade.py

      - name: Salvar dados gerados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Dados já estavam atualizados."
          else
            git commit -m "Atualiza dados gerados pelo pipeline [skip ci]"
            git push
          fi

      - name: Preparar arquivos do site
        run: |
          mkdir -p _site
          cp -r index.html base assets dados .nojekyll _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
